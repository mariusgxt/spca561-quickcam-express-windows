[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "spca561cam"
version = "0.1.0"
description = "Userspace Windows driver for the Logitech QuickCam Express and other SPCA561A webcams"
readme = "README.md"
license = { text = "GPL-2.0-or-later" }
requires-python = ">=3.9"
dependencies = [
    "libusb1>=3.1",
    "libusb-package>=1.0.26",
    "numpy>=1.24",
    "numba>=0.59",
    "opencv-python>=4.8",
    "pyvirtualcam>=0.11",
]

[project.scripts]
spca561cam = "spca561cam.app:main"

[tool.setuptools]
packages = ["spca561cam"]
